name = "mitsflix-site"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true
routes = [
  { pattern = "mitsflix.com", custom_domain = true },
  { pattern = "www.mitsflix.com", custom_domain = true },
  { pattern = "watch.mitsflix.com", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

# The bot (forms post to mitsflix.com/api/…, passed straight to it).
[[services]]
binding = "TICKETS"
service = "mitsflix-tickets"
