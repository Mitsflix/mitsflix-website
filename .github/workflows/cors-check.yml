name: HTTPS check (read-only)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in cf.126762.xyz cf.1050263.xyz cf.8899987.xyz apps.126762.xyz; do
            echo "RESULT $h https=$(curl -s -m 15 -o /dev/null -w '%{http_code}' https://$h/player_api.php?username=x\&password=y) http=$(curl -s -m 15 -o /dev/null -w '%{http_code}' http://$h/player_api.php?username=x\&password=y)"
          done
