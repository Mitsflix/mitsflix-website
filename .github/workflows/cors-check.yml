name: CORS check (read-only)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in cf.126762.xyz cf.1050263.xyz cf.8899987.xyz; do
            echo "== $h api"; curl -s -m 15 -o /dev/null -D - -H "Origin: https://mitsflix.com" "http://$h/player_api.php?username=x&password=y" | grep -iE "^HTTP|access-control|^server" ; 
            echo "== $h https"; curl -s -m 15 -o /dev/null -w "%{http_code}\n" "https://$h/player_api.php?username=x&password=y";
            echo "== $h preflight"; curl -s -m 15 -o /dev/null -D - -X OPTIONS -H "Origin: https://mitsflix.com" -H "Access-Control-Request-Method: GET" "http://$h/live/x/y/1.m3u8" | grep -iE "^HTTP|access-control";
          done
