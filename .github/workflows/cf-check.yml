name: Cloudflare settings check (read-only)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          api() { curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4$1"; }
          Z=$(api "/zones?name=mitsflix.com" | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])")
          for s in always_use_https security_header automatic_https_rewrites ssl min_tls_version; do
            echo "SETTING $s $(api /zones/$Z/settings/$s | python3 -c "import json,sys;d=json.load(sys.stdin);print(json.dumps(d.get('result',{}).get('value')) if d.get('success') else 'NOACCESS '+str(d.get('errors')))")"
          done
          echo "PAGERULES $(api /zones/$Z/pagerules | python3 -c "import json,sys;d=json.load(sys.stdin);print(len(d.get('result') or []) if d.get('success') else 'NOACCESS '+str(d.get('errors')))")"
          echo "TOKEN $(api /user/tokens/verify | python3 -c "import json,sys;print(json.load(sys.stdin).get('result',{}).get('status'))")"
