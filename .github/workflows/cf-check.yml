name: Watch check (read-only)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 20
          for u in http://watch.mitsflix.com/ http://watch.mitsflix.com/app.js http://watch.mitsflix.com/bridge.js https://watch.mitsflix.com/ https://mitsflix.com/watch; do
            echo "RESULT $u $(curl -s -o /dev/null -m 20 -w '%{http_code} %{content_type} -> %{redirect_url}' $u)"
          done
          echo "RESULT subs $(curl -s -m 20 -H 'X-Mitsflix-Web: 1' -H 'Sec-Fetch-Site: same-origin' 'http://watch.mitsflix.com/subs/subtitles?query=inception' | head -c 60)"
