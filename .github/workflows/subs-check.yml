name: Subtitles check (read-only)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          KEY: ${{ secrets.OPENSUB_API_KEY }}
        run: |
          echo "== ready"; curl -s https://mitsflix.com/subs/ready; echo
          echo "== via mitsflix.com"; curl -s -o /tmp/a -w "HTTP %{http_code}\n" -A "MitsflixPlayer/1.3.1" "https://mitsflix.com/subs/subtitles?query=inception&languages=en"; head -c 300 /tmp/a; echo
          echo "== direct"; curl -s -o /tmp/b -w "HTTP %{http_code}\n" -H "Api-Key: $KEY" -H "User-Agent: MitsflixPlayer v1.2" "https://api.opensubtitles.com/api/v1/subtitles?query=inception&languages=en"; head -c 300 /tmp/b; echo
          echo "== key length ${#KEY}"
          echo "== infos"; curl -s -w " HTTP %{http_code}\n" -H "Api-Key: $KEY" -H "User-Agent: MitsflixPlayer v1.2" "https://api.opensubtitles.com/api/v1/infos/formats" | head -c 200; echo
