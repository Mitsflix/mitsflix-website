name: API check
on: workflow_dispatch
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in signature facebook discord; do echo "$p: $(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' https://mitsflix.com/$p)"; done
          curl -s https://mitsflix.com/signature | grep -c "Customer Support"
