name: DNS check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.OPENSUB_API_KEY }}
        run: |
          python3 -c "import os,re; k=os.environ['K']; print('SHAPE', len(k), 'chars, plain key' if re.fullmatch(r'[A-Za-z0-9]{20,64}', k) else 'NOT a plain key (dots or spaces)')"
          printf 'DIRECT -> '; curl -s -L -o /tmp/r -w '%{http_code} ' -H "Api-Key: $K" -H "User-Agent: MitsflixPlayer v1.2" "https://api.opensubtitles.com/api/v1/subtitles?languages=en&query=the+matrix"; head -c 80 /tmp/r; echo
          printf 'VIA SITE -> '; curl -s -o /tmp/r -w '%{http_code} ' -A "MitsflixPlayer/1.3.0" "https://mitsflix.com/subs/subtitles?languages=en&order_by=download_count&query=the%20matrix"; head -c 120 /tmp/r; echo
