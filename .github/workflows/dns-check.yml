name: DNS check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.OPENSUB_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,base64,time
          parts=os.environ['K'].split('.')
          print('PARTS', len(parts), [len(p) for p in parts])
          try:
              pad=lambda s: s+'='*(-len(s)%4)
              head=json.loads(base64.urlsafe_b64decode(pad(parts[0])))
              body=json.loads(base64.urlsafe_b64decode(pad(parts[1])))
              print('JWT header keys', sorted(head), '| payload keys', sorted(body))
              if 'exp' in body: print('EXPIRES', time.strftime('%Y-%m-%d %H:%M UTC', time.gmtime(body['exp'])))
          except Exception as e: print('NOT A JWT', type(e).__name__)
          PY
