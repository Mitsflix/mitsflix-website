name: DNS check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -A "MitsflixPlayer/1.3.0" "https://mitsflix.com/subs/subtitles?languages=en&order_by=download_count&query=the%20matrix" | python3 -c "
          import json,sys; d=json.load(sys.stdin)
          print('SUBS results', d.get('total_count'), '| first:', (d.get('data') or [{}])[0].get('attributes',{}).get('release','?') if d.get('data') else d)"
