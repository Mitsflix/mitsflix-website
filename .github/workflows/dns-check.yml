name: DNS check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          q() { echo "--- $*"; dig +noall +comments +answer +authority "$@" | grep -E "status:|IN" ; }
          q NS mitsflix.com @1.1.1.1
          q A mitsflix.com @1.1.1.1
          q A mitsflix.com @8.8.8.8
          q SOA mitsflix.com @lochlan.ns.cloudflare.com
          q A mitsflix.com @lochlan.ns.cloudflare.com
          q A www.mitsflix.com @lochlan.ns.cloudflare.com
          q A mitsflix.com @sloan.ns.cloudflare.com
          echo "--- system"; getent ahosts mitsflix.com | head -3
          curl -sv -o /dev/null -m 20 https://mitsflix.com/ 2>&1 | grep -E "Trying|Connected|HTTP/|SSL|error|refused" | head -8
