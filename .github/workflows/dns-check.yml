name: DNS check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s https://rdap.verisign.com/com/v1/domain/mitsflix.com | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          print('STATUS', d.get('status'))
          print('REGISTRAR', [v[3] for e in d['entities'] for v in e['vcardArray'][1] if v[0]=='fn'])
          print('EVENTS', [(e['eventAction'],e['eventDate']) for e in d['events']])
          print('DNSSEC', d.get('secureDNS',{}).get('delegationSigned'))
          print('NS', [n['ldhName'] for n in d['nameservers']])"
          for p in / /android /linux; do printf 'SITE %-10s ' "$p"; curl -s -o /dev/null -r 0-99 -m 25 -w '%{http_code}\n' "https://mitsflix.com$p" || echo unreachable; done
          for r in 1.1.1.1 8.8.8.8 9.9.9.9; do printf 'RESOLVER %s ' $r; dig +dnssec +noall +comments A mitsflix.com @$r | grep -o -E "status: [A-Z]+|flags: [a-z ]+" | tr '\n' ' '; echo; done  # validating resolvers
          printf 'DNSKEY at Cloudflare: '; dig +short DNSKEY mitsflix.com @lochlan.ns.cloudflare.com | wc -l
          printf 'DS at registry: '; dig +short DS mitsflix.com @a.gtld-servers.net | wc -l
