name: DNS check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.OPENSUB_API_KEY }}
        run: |
          echo "KEYLEN ${#K} trimmed $(printf '%s' "$K" | tr -d '[:space:]' | wc -c)"
          for ua in "MitsflixPlayer v1.2" "MitsflixPlayer v1.3.0"; do
            printf 'DIRECT %s -> ' "$ua"; curl -s -o /tmp/r -w '%{http_code} ' -H "Api-Key: $(printf '%s' "$K" | tr -d '[:space:]')" -H "User-Agent: $ua" -H "Accept: application/json" "https://api.opensubtitles.com/api/v1/subtitles?languages=en&query=the%20matrix"; head -c 120 /tmp/r; echo
          done
          printf 'INFO -> '; curl -s -H "Api-Key: $(printf '%s' "$K" | tr -d '[:space:]')" -H "User-Agent: MitsflixPlayer v1.2" "https://api.opensubtitles.com/api/v1/infos/formats" | head -c 120; echo
