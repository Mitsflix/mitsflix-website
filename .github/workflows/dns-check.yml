name: DNS check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          q() { echo "--- $*"; dig +noall +comments +answer +authority "$@" | grep -E "status:|IN|EDE" ; }
          q DS mitsflix.com @a.gtld-servers.net
          q DNSKEY mitsflix.com @lochlan.ns.cloudflare.com
          q AAAA mitsflix.com @lochlan.ns.cloudflare.com
          q A mitsflix.com @1.1.1.1
          echo "--- with checking disabled"; dig +cd +short AAAA mitsflix.com @1.1.1.1
          echo "--- whois"; (whois mitsflix.com 2>/dev/null || curl -s https://rdap.verisign.com/com/v1/domain/mitsflix.com) | grep -i -E "dnssec|secureDNS|delegationSigned|Name Server|status" | head -12
