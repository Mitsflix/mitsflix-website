name: DNS check
on: { workflow_dispatch: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.OPENSUB_API_KEY }}
        run: |
          python3 - <<'PY'
          import os,re
          k=os.environ['K']
          print('SHAPE', len(k), 'chars;', 'alnum only' if k.isalnum() else 'has other chars: ' + ''.join(sorted(set(c for c in k if not c.isalnum())))[:20], '| lines:', k.count('\n')+1, '| looks like 32-char key inside:', bool(re.fullmatch(r'[A-Za-z0-9]{32}', k)))
          PY
          printf 'SEARCH -> '; curl -s -L -o /tmp/r -w '%{http_code} ' -H "Api-Key: $K" -H "User-Agent: MitsflixPlayer v1.2" "https://api.opensubtitles.com/api/v1/subtitles?languages=en&query=the+matrix"; head -c 150 /tmp/r; echo
